<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Rajas Of the Ganges - Mautoma</title>
        <link rel="stylesheet" href="style.css">
        <script src="script.js" defer></script>
    </head>
    <body>
        <div>
            <h1 class="title">Rajas Of The Ganges</h1>
        </div>
        <!-- <div class="wrapper"> -->
        <div class="card" id="main">
            <div class="difficulty-selection start">
                <h3>Select Level</h3>
                <span onclick="setDifficulty('easy')" class="option easy" id="easy">easy</span>
                <span onclick="setDifficulty('medium')" class="option medium" id="medium">medium</span>
                <span onclick="setDifficulty('hard')" class="option hard" id="hard">hard</span>
                <button onclick="start()" disabled id="startBtn">Draw first Action</button>
                       <div class="footer">
                <span>App version of the Solo Automa created by Mauro from
                    <a href="https://mautoma.com" target="_blank">mautoma.com</a>
                </span>
                <span>For rules and gameplay visit the game page on
                <a href="https://mautoma.com/rajas-of-the-ganges" target="_blank">mautoma.com</a>

                </span>
            </div>
            </div>
            <!-- controls - 'previous' not visible in default view, only for history -->
            <img
                onclick="toggleHistory()"
                src="assets/history-clock.png"
                alt="history-clock-png"
                class="history-toggle open"
                id="history-clock-img"
            >
            <h3 class="action-title" id="actionTitle"></h3>
            <div class="img-container">
            <img class="action-img" src="assets/actionIcons/chambers_Dancer.png" alt="actionImage" id="actionImage">
            </div>
            <section class="rewards-section">
                <div class="fame rewards">
                    <img class="icon" src="assets/fame.png" alt="fame-icon">
                    <span class="fame-reward reward value" id="fameReward"></span>
                </div class="rewards">
                <div class="coin rewards">
                    <img class="icon" src="assets/coin.png" alt="fame-icon">
                    <span class="coin-reward reward value" id="coinReward"></span>
                </div>
            </section>
            <button class="next-button" onclick="nextAction()">NEXT</button>
            <!-- History Overlay -->
            <div class="history-overlay" id="history-overlay">
                <span onclick="toggleHistory()" class="close" id="close">back &#8594;</span>
                <div class="history-list" id="history-list">
                    
                    <!-- dynamically rendered history entries -->
                    </div>
            </div>
        </div>
    </body>
</html>
